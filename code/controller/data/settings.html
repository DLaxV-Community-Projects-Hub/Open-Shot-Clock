
<!DOCTYPE HTML>
<html>
<head>
  <title>LaxShotClock - Settings</title>
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <link rel="icon" href="data:,">
  <link type="text/css" rel="stylesheet" href="/style.css">
  <script type="application/javascript" src="/javascript.js"></script>
</head>

<style>
    html {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    text-align: center;
    background-color: #111;
    color: #fff;
  }

  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 300;
    color: #fff;
    margin: 2rem 0;
    letter-spacing: 0.05em;
  }

  h2 {
    font-size: 1rem;
    font-weight: 400;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 2.5rem 0 1rem;
  }

  .content {
    padding: 0;
    max-width: 400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
  }

  .select-field {
    width: 100%;
    height: 48px;
    font-size: 16px;
    text-align: center;
    text-decoration: none;
    outline: none;
    color: #fff;
    background-color: #222;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0 16px;
    margin-bottom: 8px;
    display: block;
    appearance: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .select-field:focus {
    border-color: #444;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
  }

  .select-field option {
    background-color: #222;
    color: #fff;
    padding: 8px;
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }

    .content {
      max-width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      margin: 1.5rem 0;
    }

    h2 {
      font-size: 0.9rem;
      margin: 2rem 0 0.8rem;
    }
  }

</style>

<body>
  <div>
    <h1>Settings</h1>
  </div>
  <div>
    <h2>Brighness Selection</h2>
  </div>
  <div class="content">
	 <select onchange="onBrightnessSelect(value)" name="brightness" id="brightness" class="select-field">
        <option %SELECTED_BRIGHTNESS_LEVEL1% value="1">level 1</option>
        <option %SELECTED_BRIGHTNESS_LEVEL2% value="2">level 2</option>
        <option %SELECTED_BRIGHTNESS_LEVEL3% value="3">level 3</option>
        <option %SELECTED_BRIGHTNESS_LEVEL4% value="4">level 4</option>
        <option %SELECTED_BRIGHTNESS_LEVEL5% value="5">level 5</option>
        <option %SELECTED_BRIGHTNESS_LEVEL6% value="6">level 6</option>
        <option %SELECTED_BRIGHTNESS_LEVEL7% value="7">level 7</option>
        <option %SELECTED_BRIGHTNESS_LEVEL8% value="8">level 8</option>
    </select>
  </div>
  <div>
    <h2>Channel Selection</h2>
  </div>
  <div class="content">
    <select onchange="onChannelSelect(value)" name="channel" id="channel" class="select-field">
      <option %SELECTED_CHANNEL1% value="1">Channel 1</option>
      <option %SELECTED_CHANNEL2% value="2">Channel 2</option>
      <option %SELECTED_CHANNEL3% value="3">Channel 3</option>
      <option %SELECTED_CHANNEL4% value="4">Channel 4</option>
    </select>
  </div>

  <div>
    <h2>Honk Volume</h2>
  </div>
  <div class="content">
    <select onchange="onHonkVolumeSelect(value)" name="honkVolume" id="honkVolume" class="select-field">
      <option %SELECTED_HONK_VOLUME_LEVEL0% value="0">Off</option>
      <option %SELECTED_HONK_VOLUME_LEVEL1% value="1">Whisper</option>
      <option %SELECTED_HONK_VOLUME_LEVEL2% value="2">Low</option>
      <option %SELECTED_HONK_VOLUME_LEVEL3% value="3">Medium</option>
      <option %SELECTED_HONK_VOLUME_LEVEL4% value="4">High</option>
      <option %SELECTED_HONK_VOLUME_LEVEL5% value="5">Max</option>
    </select>
  </div>

  <div>
    <h2>Start Time</h2>
  <div class="content"></div>
    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;"></div>
      <button onclick="setStartTime(30)" class="select-field" style="width: auto; padding: 0 20px;">30s</button>
      <button onclick="setStartTime(80)" class="select-field" style="width: auto; padding: 0 20px;">80s</button>
    </div>
    <div style="margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <div style="color: #888; font-size: 0.9rem;">Custom</div>
      <input type="number" id="startTimeInput" min="1" max="99" class="select-field" 
        value="%CURRENT_START_TIME%" onchange="setStartTime(this.value)"
        style="width: 40px; text-align: center;">
    </div>
  </div>
 
</body> 
<script>
  const sendGetRequest = request => {
        const xmlHttp = new XMLHttpRequest();
        xmlHttp.open("GET", request, false);
        xmlHttp.send();
    }

  const onBrightnessSelect = value =>{ 
    request = `/brightness?b=${value}`  
    sendGetRequest(request)   
  }  

  const onHonkVolumeSelect = value =>{ 
    request = `/honkvolume?v=${value}`  
    sendGetRequest(request)   
  }  

  const onChannelSelect = value =>{ 
    request = `/channel?c=${value}`  
    sendGetRequest(request)   
  }  

  const setStartTime = value => {
    const numValue = parseInt(value)
    if (numValue >= 1 && numValue <= 99) {
      request = `/starttime?t=${numValue}`
      sendGetRequest(request)
      document.getElementById('startTimeInput').value = numValue
    }
  }

</script>
</html>
